name: Publish Extension Updates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target store(s) to publish to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
      allow_equal_version:
        description: 'Allow publishing version equal to existing tag (for dry-run/re-upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  preflight-and-build:
    name: Pre-flight Verification & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags for version checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: python3 tests/test_preflight.py

      - name: Run Extension Pre-flight Check
        id: preflight
        run: |
          FLAGS=""
          if [ "${{ inputs.allow_equal_version }}" = "true" ]; then
            FLAGS="--allow-equal-version"
          fi
          python3 bin/preflight_check.py $FLAGS

      - name: Upload Package Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            bin/random-album-for-youtube-music.zip
            bin/random-album-for-youtube-music.xpi

      - name: Attach Packages to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            bin/random-album-for-youtube-music.zip \
            bin/random-album-for-youtube-music.xpi \
            --clobber

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: preflight-and-build
    if: always() && needs.preflight-and-build.result == 'success' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'chrome')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: bin

      - name: Upload & Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          zip-path: 'bin/random-album-for-youtube-music.zip'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: preflight-and-build
    if: always() && needs.preflight-and-build.result == 'success' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'firefox')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: bin

      - name: Upload & Submit to Firefox Add-ons (AMO)
        uses: wdzeng/firefox-addon@v2
        with:
          addon-guid: '{33c481aa-0754-44de-b3a5-8f92416d22d4}'
          xpi-path: 'bin/random-album-for-youtube-music.xpi'
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          self-hosted: false

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: preflight-and-build
    if: always() && needs.preflight-and-build.result == 'success' && (github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'edge')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-packages
          path: bin

      - name: Upload & Submit to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: 'bin/random-album-for-youtube-music.zip'
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          notes-for-certification: 'Automated release via GitHub Actions.'
